plugins {
    // used for something??
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    // used for multi-loader stuff, NOT for the archi API
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false

    id "org.jetbrains.kotlin.jvm"
    id 'idea'
    // This needs to be in the root
    // https://github.com/FabricMC/fabric-loom/issues/612#issuecomment-1198444120
    // Also it looks like property lookups don't work this early
    id 'fabric-loom' version '1.9+' apply false

    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
    id "coffee.cypher.json-processor" version "0.1.0" apply false
}

architectury {
    minecraft = project.minecraftVersion
}

// Determine release status from the HEAD commit subject, mirroring PKPCPBP's
// MiscUtil.isRelease(getMostRecentPush(...)): a release is any commit whose
// subject starts with "[release" (case-insensitive).
def rootRecentCommit = ""
def rootIsRelease = false
try {
    def proc = ["git", "log", "--pretty=tformat:%s", "-n", "1"].execute(null, rootProject.projectDir)
    proc.waitFor()
    rootRecentCommit = proc.text.trim()
    rootIsRelease = rootRecentCommit ==~ /(?i)^\[release.*/
} catch (Exception e) {
    logger.warn("Could not determine release status from git: {}", e.toString())
}

kotlin {
    jvmToolchain(21)
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'java'
    apply plugin: 'kotlin'
    apply plugin: 'maven-publish'
    apply plugin: 'me.modmuss50.mod-publish-plugin'
    apply plugin: 'coffee.cypher.json-processor'

    group = "at.petra-k.$modID"
    base.archivesName = "$modID-$platform-$minecraftVersion"
    version = modVersion

    def isRelease = rootIsRelease
    def buildNumber = System.getenv("BUILD_NUMBER")
    if (!isRelease && buildNumber != null) {
        version += "-pre-$buildNumber"
    }

    kotlin {
        jvmToolchain(21)
    }

//    pkSubproj {
//        platform = project.platform
//        artifactId = base.archivesName.get()
//        versionDisplayName = "$platform-$minecraftVersion-$modVersion"
//    }
    // Exposed so each platform subproject's publishMods {} block can reference them.
    ext.isRelease = isRelease
    ext.modChangelog = "# " + rootRecentCommit

    // JSON5 processing (replaces PKJson5): .flatten.json5 is flattened + converted
    // to .json; plain .json5 is converted to .json. Flattening joins nested keys
    // with "." unless the accumulated prefix ends with ":", "_", "-", or "/".
    processResources {
        filesMatching(['assets/**/*.json5', 'data/**/*.json5']) {
            def isFlatten = name.endsWith('.flatten.json5')
            name = isFlatten ? name.replace('.flatten.json5', '.json') : name.replace('.json5', '.json')
            processJson {
                if (isFlatten) {
                    pipeline {
                        flatten {
                            keyDelimiter = '.'
                            skipDelimiterAfter(':', '_', '-', '/')
                        }
                    }
                }
            }
        }
    }

    // Only run mod-publishing tasks on actual releases (mirrors PKPCPBP gating).
    tasks.matching { it.name in ['publishCurseforge', 'publishModrinth', 'publishMods'] }.configureEach {
        onlyIf { project.ext.isRelease }
    }

    loom {
        silentMojangMappingsLicense() // heroes in a half-shell
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraftVersion"
        mappings loom.officialMojangMappings()
    }

    sourceSets.main.kotlin.srcDirs += 'src/main/java'

    if (project.path != ':Common') {
        loom {
            mods {
                main { // to match the default mod generated for Forge
                    sourceSet project.sourceSets.main
                    sourceSet project(':Common').sourceSets.main
                }
            }
        }
    }

    processResources {
        exclude '.cache'
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 21
    }

    // Disables Gradle's custom module metadata from being published to maven. The
    // metadata includes mapped dependencies which are not reasonably consumable by
    // other mod developers.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    repositories {
        exclusiveContent {
            filter {
                includeGroup("libs")
            }
            forRepository {
                flatDir { dir(rootProject.file("libs")) }
            }
        }
    }
    publishMods {
        type = BETA
        changelog = rootRecentCommit

        modrinth {
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            projectId = "nTW3yKrm"
            minecraftVersions.add("1.21.1")
        }
        curseforge {
            accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
            projectId = "569849"
            minecraftVersions.add("1.21.1")
            client = true
            server = true
        }
    }
}

allprojects {
    architectury {
//        compileOnly()
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << "-Xmaxerrs" << "1000"
        }
    }

    // disable most javadoc warnings
    javadoc.options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.register("runAllDatagen") {
    dependsOn ":Neoforge:runXplatDatagen"
    dependsOn ":Neoforge:runDatagen"
    dependsOn ":Fabric:runDatagen"
}
