plugins {
    // used for something??
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    // used for multi-loader stuff, NOT for the archi API
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false

    id "org.jetbrains.kotlin.jvm"
    id 'idea'
    // This needs to be in the root
    // https://github.com/FabricMC/fabric-loom/issues/612#issuecomment-1198444120
    // Also it looks like property lookups don't work this early
    id 'fabric-loom' version '1.9+' apply false

    id("at.petra-k.pkpcpbp.PKJson5Plugin") version "0.2.0-pre-104" apply false
    id "me.modmuss50.mod-publish-plugin"
}

architectury {
    minecraft = project.minecraftVersion
}

subprojects { subproject ->
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'java'
    apply plugin: 'kotlin'
    apply plugin: 'maven-publish'
    apply plugin: 'at.petra-k.pkpcpbp.PKJson5Plugin'
    if(subproject.path != ":Common") {
        apply plugin: 'me.modmuss50.mod-publish-plugin'
    }
    group = "at.petra-k.$modID"
    base.archivesName = "$modID-$platform-$minecraftVersion"
    version = modVersion

    def isRelease = true
    def buildNumber = System.getenv("BUILD_NUMBER")
    if (!isRelease && buildNumber != null) {
        version += "-pre-$buildNumber"
    }

    kotlin {
        jvmToolchain(21)
    }

    pkJson5 {
        autoProcessJson5 = true
        autoProcessJson5Flattening = true
    }

    loom {
        silentMojangMappingsLicense() // heroes in a half-shell
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraftVersion"
        mappings loom.officialMojangMappings()
    }

    sourceSets.main.kotlin.srcDirs += 'src/main/java'

    if (project.path != ':Common') {
        loom {
            mods {
                main { // to match the default mod generated for Forge
                    sourceSet project.sourceSets.main
                    sourceSet project(':Common').sourceSets.main
                }
            }
        }
    }

    processResources {
        exclude '.cache'
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 21
    }

    // Disables Gradle's custom module metadata from being published to maven. The
    // metadata includes mapped dependencies which are not reasonably consumable by
    // other mod developers.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    repositories {
        exclusiveContent {
            filter {
                includeGroup("libs")
            }
            forRepository {
                flatDir { dir(rootProject.file("libs")) }
            }
        }
    }
    if(subproject.path != ":Common") {
        publishMods {
            type = BETA
            changelog = ""

            modrinth {
                accessToken = providers.environmentVariable("MODRINTH_TOKEN")
                projectId = "nTW3yKrm"
                minecraftVersions.add("1.21.1")
            }
            curseforge {
                accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
                projectId = "569849"
                minecraftVersions.add("1.21.1")
                client = true
                server = true
            }
            discord {
                webhookUrl = providers.environmentVariable("discordWebhook")
            }
        }
    }
}

allprojects {
    architectury {
//        compileOnly()
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << "-Xmaxerrs" << "1000"
        }
    }

    // disable most javadoc warnings
    javadoc.options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.register("runAllDatagen") {
    dependsOn ":Neoforge:runXplatDatagen"
    dependsOn ":Neoforge:runDatagen"
    dependsOn ":Fabric:runDatagen"
}
