name: Deploy the web book

on:
  push:
    # Keep in sync with on.push.branches-ignore in build_docs.yml
    branches:
      - main
      - '1.21'
  workflow_dispatch:
    inputs:
      hexdoc-release:
        description: Build in release mode
        type: boolean
      pypi-release:
        description: Publish a PyPI release (requires release mode)
        type: boolean

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      hexdoc-release: ${{ steps.check.outputs.hexdoc-release }}
      pypi-release: ${{ steps.check.outputs.pypi-release }}
    steps:
      - name: Check conditions
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            HEXDOC_RELEASE="${{ inputs.hexdoc-release }}"
            PYPI_RELEASE="${{ inputs.hexdoc-release && inputs.pypi-release }}"
          else
            HEXDOC_RELEASE="${{ startsWith(github.event.head_commit.message, '[Release]') }}"
            PYPI_RELEASE="$HEXDOC_RELEASE"
          fi
          echo "hexdoc-release=$HEXDOC_RELEASE" | tee -a "$GITHUB_OUTPUT"
          echo "pypi-release=$PYPI_RELEASE" | tee -a "$GITHUB_OUTPUT"

  build:
    needs:
      - setup
    permissions:
      contents: read
      pages: read
    uses: ./.github/workflows/build_docs.yml
    secrets: inherit
    with:
      hexdoc-release: ${{ needs.setup.outputs.hexdoc-release == 'true' }}

  deploy-pages:
    needs:
      - setup
      - build
    runs-on: ubuntu-latest
    concurrency:
      group: hexdoc-deploy-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --no-dev

      - name: Merge new hexdoc build into existing book
        uses: hexdoc-dev/actions/merge@v1
        with:
          release: ${{ needs.setup.outputs.hexdoc-release == 'true' }}
          site-url: ${{ needs.build.outputs.pages-url }}

      - name: Deploy to Pages
        uses: hexdoc-dev/actions/deploy-pages@v1
        with:
          merge: false
          release: ${{ needs.setup.outputs.hexdoc-release == 'true' }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
      - deploy-pages
    if: needs.setup.outputs.pypi-release == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/hexdoc-hexcasting
    permissions:
      id-token: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: hexdoc-build
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
